<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陈师傅在干嘛？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .title {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 14px;
            color: #888;
            margin-bottom: 30px;
        }

        /* Q版形象区域 */
        .avatar-container {
            width: 220px;
            height: 220px;
            margin: 0 auto 30px;
            position: relative;
            background: #fff;
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .avatar {
            width: 100%;
            height: 100%;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* 日版黑白线稿风格 */
        .manga-style {
            filter: contrast(1.1);
        }

        /* 状态显示 */
        .status-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .status-emoji {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .status-text {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .status-desc {
            font-size: 14px;
            color: #666;
        }

        /* 时间信息 */
        .time-info {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .time-row:last-child {
            margin-bottom: 0;
        }

        .time-label {
            color: #888;
        }

        .time-value {
            color: #333;
            font-weight: bold;
        }

        /* 进度条 */
        .progress-container {
            background: #e0e0e0;
            border-radius: 10px;
            height: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease;
        }

        .progress-bar.working {
            background: linear-gradient(90deg, #ff6b6b, #ee5a5a);
        }

        .progress-bar.resting {
            background: linear-gradient(90deg, #51cf66, #40c057);
        }

        .progress-bar.sleeping {
            background: linear-gradient(90deg, #845ef7, #7950f2);
        }

        .progress-bar.preparing {
            background: linear-gradient(90deg, #ffa726, #ff9800);
        }

        /* 即将到来的班次卡片 */
        .upcoming-card {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 5px solid #2196f3;
            transition: all 0.3s ease;
        }

        .upcoming-card.preparing {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            border-left-color: #ff9800;
        }

        .upcoming-card.working {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            border-left-color: #f44336;
        }

        .upcoming-card.resting {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-left-color: #4caf50;
        }

        .upcoming-label {
            font-size: 12px;
            color: #1976d2;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .upcoming-card.preparing .upcoming-label {
            color: #e65100;
        }

        .upcoming-card.working .upcoming-label {
            color: #c62828;
        }

        .upcoming-card.resting .upcoming-label {
            color: #2e7d32;
        }

        .upcoming-main {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .upcoming-time {
            font-size: 20px;
            font-weight: bold;
            color: #1565c0;
        }

        .upcoming-card.preparing .upcoming-time {
            color: #e65100;
        }

        .upcoming-card.working .upcoming-time {
            color: #c62828;
        }

        .upcoming-card.resting .upcoming-time {
            color: #2e7d32;
        }

        .upcoming-shift {
            font-size: 18px;
            color: #424242;
            font-weight: 600;
        }

        .upcoming-detail {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        /* 轮班信息 */
        .schedule-info {
            background: #fff3cd;
            border-radius: 15px;
            padding: 15px;
            font-size: 13px;
            color: #856404;
        }

        .schedule-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* 状态颜色主题 */
        .theme-working { --main-color: #ff6b6b; }
        .theme-resting { --main-color: #51cf66; }
        .theme-sleeping { --main-color: #845ef7; }
        .theme-commuting { --main-color: #ffa94d; }

        /* 动态表情SVG */
        .character-svg {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

            // 第7天：大休第2天
            7: [
                { start: 0, end: 510, status: 'sleeping', text: '睡觉中', desc: '好好休息', emoji: '😴' },
                { start: 510, end: 1380, status: 'resting', text: '休息中', desc: '大休第2天 - 享受假期', emoji: '🎉' },
                { start: 1380, end: 1440, status: 'sleeping', text: '睡觉中', desc: '好好休息', emoji: '😴' }
            ],
            // 第8天：大休第3天
            8: [
                { start: 0, end: 510, status: 'sleeping', text: '睡觉中', desc: '好好休息', emoji: '😴' },
                { start: 510, end: 1380, status: 'resting', text: '休息中', desc: '大休第3天 - 享受假期', emoji: '🎉' },
                { start: 1380, end: 1440, status: 'sleeping', text: '睡觉中', desc: '明天开始新周期', emoji: '😴' }
            ]
        };

        // 获取当前是第几天
        function getCurrentCycleDay(date) {
            const diffTime = date - BASE_DATE;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            let cycleDay = ((BASE_CYCLE_DAY - 1 + diffDays) % 8) + 1;
            // 处理负数
            if (cycleDay <= 0) cycleDay += 8;
            return cycleDay;
        }

        // 时间字符串转分钟数
        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

        // 获取当前状态 - 使用查表法
        function getCurrentStatus(date) {
            const cycleDay = getCurrentCycleDay(date);
            const currentMinutes = date.getHours() * 60 + date.getMinutes();
            
            // 获取当天的所有时间段
            const daySchedule = DAY_SCHEDULES[cycleDay];
            if (!daySchedule) {
                return { status: 'resting', emoji: '🤔', text: '状态未知', desc: '正在计算中...', progress: 0, nextChange: 0 };
            }
            
            // 查找当前时间所在的时间段
            let currentSlot = null;
            for (const slot of daySchedule) {
                if (currentMinutes >= slot.start && currentMinutes < slot.end) {
                    currentSlot = slot;
                    break;
                }
            }
            
            // 如果没找到（理论上不会发生），返回休息状态
            if (!currentSlot) {
                return { status: 'resting', emoji: '🤔', text: '状态未知', desc: '正在计算中...', progress: 0, nextChange: 0 };
            }
            
            // 计算进度和剩余时间
            const totalDuration = currentSlot.end - currentSlot.start;
            const elapsed = currentMinutes - currentSlot.start;
            const progress = (elapsed / totalDuration) * 100;
            const timeLeft = currentSlot.end - currentMinutes;
            
            // 特殊处理：白班日（第1、4天）22:00-24:00的睡觉，nextChange应该是次日02:10
            let nextChange = currentSlot.end;
            if ((cycleDay === 1 || cycleDay === 4) && currentSlot.start === 1320 && currentSlot.end === 1440) {
                nextChange = 130 + 24 * 60; // 次日02:10
            }
            
            return {
                status: currentSlot.status,
                emoji: currentSlot.emoji,
                text: currentSlot.text,
                desc: currentSlot.desc,
                progress: progress,
                timeLeft: timeLeft,
                nextChange: nextChange
            };
        }

        // 格式化时间
        function formatTime(minutes) {
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        }

        // 格式化剩余时间
        function formatDuration(minutes) {
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${hours}小时${mins}分`;
        }

        // 班次信息配置（用于getUpcomingShift）
        const SHIFT_INFO = {
            1: { type: 'day', name: '白班', start: '08:00', end: '19:00' },
            2: { type: 'night', shifts: [
                { name: '后夜班', start: '02:30', end: '08:30' },
                { name: '前夜班', start: '19:00', end: '次日02:30' }
            ]},
            3: { type: 'rest', name: '小休' },
            4: { type: 'day', name: '白班', start: '08:00', end: '19:00' },
            5: { type: 'night', shifts: [
                { name: '后夜班', start: '02:30', end: '08:30' },
                { name: '前夜班', start: '19:00', end: '次日02:30' }
            ]},
            6: { type: 'rest', name: '大休第1天' },
            7: { type: 'rest', name: '大休第2天' },
            8: { type: 'rest', name: '大休第3天' }
        };

        // 获取即将到来的班次
        function getUpcomingShift(date) {
            const cycleDay = getCurrentCycleDay(date);
            const currentMinutes = date.getHours() * 60 + date.getMinutes();
            const currentHour = date.getHours();
            
            let nextShift = null;
            let minutesUntil = 0;
            
            // 检查今天的班次
            const todaySchedule = SHIFT_INFO[cycleDay];
            
            if (todaySchedule.type === 'day') {
                // 白班日
                const workStart = timeToMinutes(todaySchedule.start);
                if (currentMinutes < workStart) {
                    // 还没上班
                    nextShift = {
                        name: todaySchedule.name,
                        time: todaySchedule.start,
                        end: todaySchedule.end,
                        type: 'start'
                    };
                    minutesUntil = workStart - currentMinutes;
                }
            } else if (todaySchedule.type === 'night') {
                // 夜班日
                const shift1Start = timeToMinutes(todaySchedule.shifts[0].start);
                const shift1End = timeToMinutes(todaySchedule.shifts[0].end);
                const shift2Start = timeToMinutes(todaySchedule.shifts[1].start);
                
                if (currentMinutes < shift1Start) {
                    // 凌晨2:30前，第一个夜班还没开始
                    nextShift = {
                        name: todaySchedule.shifts[0].name,
                        time: todaySchedule.shifts[0].start,
                        end: todaySchedule.shifts[0].end,
                        type: 'start'
                    };
                    minutesUntil = shift1Start - currentMinutes;
                } else if (currentMinutes >= shift1End && currentMinutes < shift2Start) {
                    // 两个夜班之间
                    nextShift = {
                        name: todaySchedule.shifts[1].name,
                        time: todaySchedule.shifts[1].start,
                        end: '次日02:30',
                        type: 'start'
                    };
                    minutesUntil = shift2Start - currentMinutes;
                }
            }
            
            // 如果今天没有即将开始的班次，找下一天的
            if (!nextShift) {
                let checkDay = cycleDay;
                let daysToAdd = 0;
                
                while (!nextShift && daysToAdd < 8) {
                    daysToAdd++;
                    checkDay = checkDay % 8 + 1;
                    const nextSchedule = SHIFT_INFO[checkDay];
                    
                    if (nextSchedule.type === 'day') {
                        nextShift = {
                            name: nextSchedule.name,
                            time: nextSchedule.start,
                            end: nextSchedule.end,
                            daysLater: daysToAdd
                        };
                        // 计算到下一天上班时间的分钟数
                        const remainingToday = 24 * 60 - currentMinutes;
                        const untilSleepEnd = (daysToAdd - 1) * 24 * 60 + timeToMinutes(nextSchedule.start);
                        minutesUntil = remainingToday + untilSleepEnd;
                    } else if (nextSchedule.type === 'night') {
                        // 夜班从凌晨2:30开始
                        nextShift = {
                            name: nextSchedule.shifts[0].name,
                            time: nextSchedule.shifts[0].start,
                            end: nextSchedule.shifts[0].end,
                            daysLater: daysToAdd
                        };
                        const remainingToday = 24 * 60 - currentMinutes;
                        const untilShiftStart = (daysToAdd - 1) * 24 * 60 + timeToMinutes(nextSchedule.shifts[0].start);
                        minutesUntil = remainingToday + untilShiftStart;
                    }
                }
            }
            
            return {
                shift: nextShift,
                minutesUntil: minutesUntil
            };
        }

        // 更新角色表情
        function updateCharacter(status) {
            const eyes = document.getElementById('eyes');
            const eyesClosed = document.getElementById('eyes-closed');
            const eyesWorking = document.getElementById('eyes-working');
            const eyesPreparing = document.getElementById('eyes-preparing');
            const mouth = document.getElementById('mouth');
            const mouthWorking = document.getElementById('mouth-working');
            const mouthSleeping = document.getElementById('mouth-sleeping');
            const mouthPreparing = document.getElementById('mouth-preparing');
            const zzz = document.getElementById('zzz');
            const sweat = document.getElementById('sweat');
            const music = document.getElementById('music');
            const pillow = document.getElementById('pillow');
            const tools = document.getElementById('tools');
            const preparingItem = document.getElementById('preparing-item');
            const blush = document.getElementById('blush');
            const speedLines = document.getElementById('speed-lines');

            // 重置所有
            eyes.style.display = 'block';
            eyesClosed.style.display = 'none';
            eyesWorking.style.display = 'none';
            if (eyesPreparing) eyesPreparing.style.display = 'none';
            mouth.style.display = 'block';
            if (mouthWorking) mouthWorking.style.display = 'none';
            if (mouthSleeping) mouthSleeping.style.display = 'none';
            if (mouthPreparing) mouthPreparing.style.display = 'none';
            zzz.style.display = 'none';
            sweat.style.display = 'none';
            music.style.display = 'none';
            pillow.style.display = 'none';
            tools.style.display = 'none';
            if (preparingItem) preparingItem.style.display = 'none';
            if (blush) blush.style.opacity = '0.4';
            if (speedLines) speedLines.style.display = 'none';

            if (status === 'sleeping') {
                eyes.style.display = 'none';
                eyesClosed.style.display = 'block';
                mouth.style.display = 'none';
                if (mouthSleeping) mouthSleeping.style.display = 'block';
                zzz.style.display = 'block';
                pillow.style.display = 'block';
                if (blush) blush.style.opacity = '0.2';
            } else if (status === 'working') {
                eyes.style.display = 'none';
                eyesWorking.style.display = 'block';
                mouth.style.display = 'none';
                if (mouthWorking) mouthWorking.style.display = 'block';
                sweat.style.display = 'block';
                tools.style.display = 'block';
                if (speedLines) speedLines.style.display = 'block';
                if (blush) blush.style.opacity = '0.2';
            } else if (status === 'preparing') {
                eyes.style.display = 'none';
                if (eyesPreparing) eyesPreparing.style.display = 'block';
                mouth.style.display = 'none';
                if (mouthPreparing) mouthPreparing.style.display = 'block';
                if (preparingItem) preparingItem.style.display = 'block';
                if (blush) blush.style.opacity = '0.5';
            } else if (status === 'resting') {
                music.style.display = 'block';
                if (blush) blush.style.opacity = '0.5';
            }
        }

        // 更新页面
        function updatePage() {
            const now = new Date();
            const cycleDay = getCurrentCycleDay(now);
            const status = getCurrentStatus(now);
            const schedule = SHIFT_INFO[cycleDay];
            
            // 更新时间
            document.getElementById('currentTime').textContent = 
                `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            // 更新轮班天数
            document.getElementById('cycleDay').textContent = `第${cycleDay}天`;
            
            // 更新状态卡片
            document.getElementById('statusEmoji').textContent = status.emoji;
            document.getElementById('statusText').textContent = status.text;
            document.getElementById('statusDesc').textContent = status.desc;
            
            // 更新进度条
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = `${status.progress}%`;
            progressBar.className = `progress-bar ${status.status}`;
            
            // 更新时间剩余和标签
            const timeLeftLabel = document.getElementById('timeLeftLabel');
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            
            if (status.status === 'working') {
                timeLeftLabel.textContent = '距离下班还有';
                if (status.timeLeft) {
                    document.getElementById('timeLeft').textContent = formatDuration(status.timeLeft);
                }
            } else {
                // 特殊情况：第6天通勤时间（02:30-03:00）接下来是睡觉
                const isCommute = cycleDay === 6 && currentMinutes >= 150 && currentMinutes < 180;
                
                if (status.status === 'preparing' && isCommute) {
                    timeLeftLabel.textContent = '距离睡觉还有';
                } else if (status.status === 'preparing') {
                    timeLeftLabel.textContent = '距离上班还有';
                } else if (status.status === 'resting') {
                    timeLeftLabel.textContent = '距离睡觉还有';
                } else if (status.status === 'sleeping') {
                    timeLeftLabel.textContent = '距离起床还有';
                } else {
                    timeLeftLabel.textContent = '距离上班还有';
                }
                
                if (status.nextChange) {
                    // nextChange可能大于1440（跨天），直接计算差值
                    const diff = status.nextChange - currentMinutes;
                    document.getElementById('timeLeft').textContent = formatDuration(diff);
                }
            }
            
            // 更新排班详情 - 直接从时间点模型表获取
            const daySchedule = DAY_SCHEDULES[cycleDay];
            let currentSlot = null;
            for (const slot of daySchedule) {
                if (currentMinutes >= slot.start && currentMinutes < slot.end) {
                    currentSlot = slot;
                    break;
                }
            }
            
            let scheduleText = `今天是${now.getMonth() + 1}月${now.getDate()}日，本轮第${cycleDay}天`;
            if (currentSlot) {
                scheduleText += `，${currentSlot.desc}`;
            }
            document.getElementById('scheduleDetail').textContent = scheduleText;
            
            // 更新即将到来的班次/下班卡片
            const upcomingCard = document.getElementById('upcomingCard');
            upcomingCard.className = 'upcoming-card ' + status.status;
            
            if (status.status === 'working') {
                // 正在上班，显示距离下班
                document.querySelector('.upcoming-label').textContent = '🏃 距离下班还有';
                if (status.timeLeft) {
                    document.getElementById('upcomingTime').textContent = formatDuration(status.timeLeft);
                    document.getElementById('upcomingShift').textContent = '就下班了';
                    document.getElementById('upcomingDetail').textContent = '加油！坚持就是胜利';
                }
            } else if (status.status === 'preparing') {
                // 准备上班
                document.querySelector('.upcoming-label').textContent = '⏰ 即将上班';
                if (status.timeLeft) {
                    document.getElementById('upcomingTime').textContent = formatDuration(status.timeLeft);
                    document.getElementById('upcomingShift').textContent = '后出发';
                    // 获取当前班次信息
                    let shiftDetail = '';
                    if (schedule.type === 'day') {
                        shiftDetail = `${schedule.start} - ${schedule.end} 白班`;
                    } else if (schedule.type === 'night') {
                        const currentMinutes = now.getHours() * 60 + now.getMinutes();
                        if (currentMinutes < timeToMinutes(schedule.shifts[0].start)) {
                            shiftDetail = `${schedule.shifts[0].start} - ${schedule.shifts[0].end} 后夜班`;
                        } else {
                            // 将26:30转换为02:30显示
                            const endMin = timeToMinutes(schedule.shifts[1].end);
                            const endDisplay = endMin >= 24 * 60 ? formatTime(endMin - 24 * 60) : schedule.shifts[1].end;
                            shiftDetail = `${schedule.shifts[1].start} - 次日${endDisplay} 前夜班`;
                        }
                    }
                    document.getElementById('upcomingDetail').textContent = shiftDetail;
                }
            } else {
                // 其他状态，显示即将到来的班次
                document.querySelector('.upcoming-label').textContent = '⏰ 即将上什么班';
                const upcoming = getUpcomingShift(now);
                if (upcoming && upcoming.shift) {
                    const daysText = upcoming.shift.daysLater ? 
                        (upcoming.shift.daysLater === 1 ? '明天' : `${upcoming.shift.daysLater}天后`) : '';
                    const timeText = formatDuration(upcoming.minutesUntil);
                    
                    document.getElementById('upcomingTime').textContent = 
                        upcoming.shift.daysLater ? `${daysText} ${upcoming.shift.time}` : `${timeText}后`;
                    document.getElementById('upcomingShift').textContent = `上${upcoming.shift.name}`;
                    // 处理跨天时间的显示
                    let displayEnd = upcoming.shift.end;
                    if (upcoming.shift.name.includes('前夜班') && upcoming.shift.end.includes(':')) {
                        // 已经是格式化过的，直接显示
                        displayEnd = upcoming.shift.end;
                    }
                    document.getElementById('upcomingDetail').textContent = 
                        `${upcoming.shift.time} - ${displayEnd}`;
                } else {
                    document.getElementById('upcomingTime').textContent = '暂无排班';
                    document.getElementById('upcomingShift').textContent = '';
                    document.getElementById('upcomingDetail').textContent = '';
                }
            }
            
            // 更新角色表情
            updateCharacter(status.status);
        }

        // 初始化并定时更新
        updatePage();
        setInterval(updatePage, 60000); // 每分钟更新一次
    </script>
</body>
</html>
